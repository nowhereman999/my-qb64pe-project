name: Compile BASIC_To_6809 (Linux ARM64)

on:
  push:
    paths:
      - 'BASIC-To-6809_Source_Code/*.bas'
      - 'BASIC-To-6809_Source_Code/*.BAS'
      - 'BASIC-To-6809_Source_Code/IDE/SDECB.bas'
      - 'BASIC-To-6809_Source_Code/IDE/SDECB.BAS'
  pull_request:
    paths:
      - 'BASIC-To-6809_Source_Code/*.bas'
      - 'BASIC-To-6809_Source_Code/*.BAS'
      - 'BASIC-To-6809_Source_Code/IDE/SDECB.bas'
      - 'BASIC-To-6809_Source_Code/IDE/SDECB.BAS'
  workflow_dispatch:
    inputs:
      bas_paths:
        description: 'Comma-separated .bas file paths (relative to repo root)'
        required: false
        type: string

jobs:
  discover:
    name: Discover BASIC files
    runs-on: ubuntu-24.04
    outputs:
      files: ${{ steps.set-files.outputs.files }}
      count: ${{ steps.set-files.outputs.count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build file list
        id: set-files
        shell: bash
        env:
          INPUT_BAS_PATHS: ${{ inputs.bas_paths }}
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import json
          import glob

          files = []

          manual = os.environ.get("INPUT_BAS_PATHS", "").strip()
          if manual:
              files = [x.strip() for x in manual.split(",") if x.strip()]
          else:
              root = "BASIC-To-6809_Source_Code"

              files.extend(sorted(glob.glob(f"{root}/*.bas")))
              files.extend(sorted(glob.glob(f"{root}/*.BAS")))

              sdecb1 = f"{root}/IDE/SDECB.bas"
              sdecb2 = f"{root}/IDE/SDECB.BAS"

              if os.path.isfile(sdecb1):
                  files.append(sdecb1)
              elif os.path.isfile(sdecb2):
                  files.append(sdecb2)

          # Remove duplicates while preserving order
          seen = set()
          unique = []
          for f in files:
              if f not in seen:
                  seen.add(f)
                  unique.append(f)

          print("files=" + json.dumps(unique))
          print("count=" + str(len(unique)))
          PY

      - name: Show discovered files
        shell: bash
        run: |
          echo "Discovered ${{ steps.set-files.outputs.count }} file(s)"
          echo '${{ steps.set-files.outputs.files }}'

  build:
    name: Build ${{ matrix.file }}
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.discover.outputs.files) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FULL build + runtime dependencies (ARM64, Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential g++ make \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libpng-dev \
            libcurl4-openssl-dev \
            libasound2t64 \
            libx11-dev libxi-dev libxrender-dev libxext-dev \
            libxfixes-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxss-dev \
            libpulse-dev libfreetype-dev zlib1g-dev \
            zip coreutils procps

      - name: Verify QB64-PE ARM64 setup
        shell: bash
        run: |
          QB64PE_DIR="$GITHUB_WORKSPACE/tools/qb64pe_Linux_arm64"
          echo "Looking for QB64-PE in: $QB64PE_DIR"
          [ -d "$QB64PE_DIR" ] || { echo "ERROR: $QB64PE_DIR missing! Commit the folder."; exit 1; }
          cd "$QB64PE_DIR"
          [ -f "./qb64pe" ] || { echo "qb64pe missing!"; exit 1; }
          [ -d "./internal" ] || { echo "internal/ missing!"; exit 1; }
          [ -f "./Makefile" ] || { echo "Makefile missing!"; exit 1; }
          file ./qb64pe
          echo "QB64-PE ARM64 setup verified."

      - name: Make qb64pe executable
        shell: bash
        run: |
          chmod +x "$GITHUB_WORKSPACE/tools/qb64pe_Linux_arm64/qb64pe"

      - name: Show runner resources before compile
        shell: bash
        run: |
          echo "=== RUNNER INFO BEFORE COMPILE ==="
          date
          uname -a
          echo ""
          echo "CPU count:"
          nproc
          echo ""
          echo "Memory:"
          free -h
          echo ""
          echo "Disk:"
          df -h
          echo ""
          echo "Top memory users:"
          ps -eo pid,ppid,%cpu,%mem,cmd --sort=-%mem | head -20 || true
          echo "=================================="

      - name: Clean QB64 temp area before compile
        shell: bash
        run: |
          QB64PE_DIR="$GITHUB_WORKSPACE/tools/qb64pe_Linux_arm64"
          rm -rf "$QB64PE_DIR/internal/temp/"* 2>/dev/null || true

      - name: Compile selected .bas file
        id: compile
        shell: bash
        run: |
          set -euo pipefail

          QB64PE_DIR="$GITHUB_WORKSPACE/tools/qb64pe_Linux_arm64"
          ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACT_DIR"

          file="${{ matrix.file }}"
          file="$(echo "$file" | xargs)"

          [[ "$file" =~ \.[bB][aA][sS]$ ]] || { echo "Not a .bas file: $file"; exit 1; }

          rel_dir=$(dirname "$file")
          filename=$(basename "$file")
          base="${filename%.*}"
          full_dir="$GITHUB_WORKSPACE/$rel_dir"

          echo "Compiling (in $rel_dir): $filename -> $base"
          cd "$full_dir"

          echo "=== BEFORE COMPILE ==="
          date
          free -h
          df -h
          ps -eo pid,ppid,%cpu,%mem,cmd --sort=-%mem | head -20 || true
          echo "======================"

          if ! timeout 150m "$QB64PE_DIR/qb64pe" -x "$filename" -o "$base"; then
            LOG_PATH="$QB64PE_DIR/internal/temp/compilelog.txt"
            echo "=== COMPILATION ERROR ==="
            if [ -f "$LOG_PATH" ]; then
              echo "Contents of $LOG_PATH:"
              cat "$LOG_PATH"
            else
              echo "compilelog.txt not found."
            fi
            echo "========================"
            exit 1
          fi

          [ -f "$base" ] || { echo "ERROR: $base was not created!"; exit 1; }

          cp "$base" "$ARTIFACT_DIR/$base"
          rm -f "$base"

          echo "executable=$base" >> "$GITHUB_OUTPUT"

      - name: Show runner resources after compile
        shell: bash
        run: |
          echo "=== RUNNER INFO AFTER COMPILE ==="
          date
          free -h
          df -h
          echo ""
          echo "Top memory users:"
          ps -eo pid,ppid,%cpu,%mem,cmd --sort=-%mem | head -20 || true
          echo "================================="

      - name: Clean QB64 temp area after compile
        if: always()
        shell: bash
        run: |
          QB64PE_DIR="$GITHUB_WORKSPACE/tools/qb64pe_Linux_arm64"
          rm -rf "$QB64PE_DIR/internal/temp/"* 2>/dev/null || true
          find "$QB64PE_DIR" -name '*.o' -delete 2>/dev/null || true
          find "$QB64PE_DIR" -name '*.a' -delete 2>/dev/null || true

      - name: Create zip archive for this executable
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/artifacts"
          zip "${{ steps.compile.outputs.executable }}_Linux_arm64.zip" "${{ steps.compile.outputs.executable }}"
          rm -f "${{ steps.compile.outputs.executable }}"
          echo "Zipped ${{ steps.compile.outputs.executable }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qb64pe-linux-arm64-${{ steps.compile.outputs.executable }}
          path: ${{ github.workspace }}/artifacts/${{ steps.compile.outputs.executable }}_Linux_arm64.zip
          retention-days: 30

      - name: Job summary
        if: success()
        shell: bash
        run: |
          echo "## QB64-PE Linux ARM64 Build Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Compiled program for **aarch64**:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.compile.outputs.executable }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the zip from **Artifacts** below" >> "$GITHUB_STEP_SUMMARY"
          echo "*Native Linux ARM64 executable*" >> "$GITHUB_STEP_SUMMARY"
          
