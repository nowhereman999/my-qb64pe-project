name: Compile BASIC_To_6809 (Linux x86_64)

on:
  push:
    paths:
      - 'BASIC-To-6809_Source_Code/*.bas'
      - 'BASIC-To-6809_Source_Code/*.BAS'
      - 'BASIC-To-6809_Source_Code/IDE/SDECB.bas'
      - 'BASIC-To-6809_Source_Code/IDE/SDECB.BAS'
  pull_request:
    paths:
      - 'BASIC-To-6809_Source_Code/*.bas'
      - 'BASIC-To-6809_Source_Code/*.BAS'
      - 'BASIC-To-6809_Source_Code/IDE/SDECB.bas'
      - 'BASIC-To-6809_Source_Code/IDE/SDECB.BAS'
  workflow_dispatch:
    inputs:
      bas_paths:
        description: 'Comma-separated .bas file paths (relative to repo root)'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang + QB64 prerequisites (Linux x86_64)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            build-essential \
            make \
            libglew-dev \
            freeglut3-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libpng-dev \
            libcurl4-openssl-dev \
            libasound2t64 \
            libx11-dev \
            libxi-dev \
            libxrender-dev \
            libxext-dev \
            libxfixes-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxss-dev \
            libpthread-stubs0-dev \
            libfreetype-dev \
            zlib1g-dev \
            zip

      - name: Verify QB64-PE Linux x86_64 setup
        run: |
          QB64PE_DIR="$GITHUB_WORKSPACE/tools/qb64pe_Linux_x86_64"
          echo "Looking for QB64-PE in: $QB64PE_DIR"
          [ -d "$QB64PE_DIR" ] || { echo "ERROR: $QB64PE_DIR missing! Commit the folder."; exit 1; }
          cd "$QB64PE_DIR"
          [ -f "./qb64pe" ] || { echo "qb64pe missing!"; exit 1; }
          [ -d "./internal" ] || { echo "internal/ missing!"; exit 1; }
          [ -f "./Makefile" ] || { echo "Makefile missing!"; exit 1; }
          file ./qb64pe
          echo "QB64-PE setup verified."

      - name: Make qb64pe executable
        run: |
          chmod +x "$GITHUB_WORKSPACE/tools/qb64pe_Linux_x86_64/qb64pe"

      - name: Compile selected .bas files with Clang
        id: compile
        shell: bash
        run: |
          set -euo pipefail

          QB64PE_DIR="$GITHUB_WORKSPACE/tools/qb64pe_Linux_x86_64"
          ARTIFACT_DIR="$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$ARTIFACT_DIR"

          export CXX=clang++
          export CXXFLAGS="-O0 -fno-rtti -std=gnu++17"
          export LDFLAGS="-lGLEW -lGL -lGLU -lglut -lm -lpthread -lcurl"

          echo "CXX=$CXX"
          echo "CXXFLAGS=$CXXFLAGS"
          echo "LDFLAGS=$LDFLAGS"

          ROOT_DIR="$GITHUB_WORKSPACE/BASIC-To-6809_Source_Code"
          FILE_ARRAY=()

          if [ -n "${{ inputs.bas_paths }}" ]; then
            IFS=',' read -r -a RAW_FILES <<< "${{ inputs.bas_paths }}"
            for f in "${RAW_FILES[@]}"; do
              # Trim leading/trailing whitespace, but keep spaces inside the filename.
              f="$(printf '%s' "$f" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')"
              [ -n "$f" ] && FILE_ARRAY+=("$f")
            done
          else
            for f in "$ROOT_DIR"/*; do
              if [[ -f "$f" && ("$f" == *.bas || "$f" == *.BAS) ]]; then
                rel_path="${f#$GITHUB_WORKSPACE/}"
                FILE_ARRAY+=("$rel_path")
              fi
            done

            if [ -f "$ROOT_DIR/IDE/SDECB.bas" ]; then
              FILE_ARRAY+=("BASIC-To-6809_Source_Code/IDE/SDECB.bas")
            elif [ -f "$ROOT_DIR/IDE/SDECB.BAS" ]; then
              FILE_ARRAY+=("BASIC-To-6809_Source_Code/IDE/SDECB.BAS")
            fi
          fi

          # Remove duplicates safely, even when filenames contain spaces.
          UNIQUE_ARRAY=()
          for f in "${FILE_ARRAY[@]}"; do
            found=0
            for u in "${UNIQUE_ARRAY[@]}"; do
              if [ "$u" = "$f" ]; then
                found=1
                break
              fi
            done
            [ "$found" -eq 0 ] && UNIQUE_ARRAY+=("$f")
          done
          FILE_ARRAY=("${UNIQUE_ARRAY[@]}")

          if [ ${#FILE_ARRAY[@]} -eq 0 ]; then
            echo "No .bas files to compile."
            echo "executables=" >> "$GITHUB_OUTPUT"
            echo "compiled_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Compiling ${#FILE_ARRAY[@]} file(s):"
          printf ' - %s\n' "${FILE_ARRAY[@]}"

          EXECUTABLES=()
          COUNT=0

          for file in "${FILE_ARRAY[@]}"; do
            [[ ! "$file" =~ \.[bB][aA][sS]$ ]] && continue

            rel_dir="$(dirname "$file")"
            filename="$(basename "$file")"
            base="${filename%.*}"
            full_dir="$GITHUB_WORKSPACE/$rel_dir"

            echo "Compiling (in $rel_dir): $filename → $base"
            cd "$full_dir"

            if ! "$QB64PE_DIR/qb64pe" -c -x "$filename" -o "$base"; then
              LOG_PATH="$QB64PE_DIR/internal/temp/compilelog.txt"
              echo "=== COMPILATION ERROR ==="
              if [ -f "$LOG_PATH" ]; then
                cat "$LOG_PATH"
              else
                echo "compilelog.txt not found."
              fi
              echo "========================"
              exit 1
            fi

            [ -f "$base" ] || { echo "ERROR: $base was not created."; exit 1; }

            cp "$base" "$ARTIFACT_DIR/$base"
            rm -f "$base"

            EXECUTABLES+=("$base")
            COUNT=$((COUNT + 1))
          done

          {
            echo "executables<<EOF"
            printf '%s\n' "${EXECUTABLES[@]}"
            echo "EOF"
            echo "compiled_count=$COUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Create zip archive
        if: steps.compile.outputs.compiled_count > 0
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE/artifacts"
          rm -f qb64pe_Linux_x86_64_executables.zip

          while IFS= read -r exe; do
            [ -n "$exe" ] && zip qb64pe_Linux_x86_64_executables.zip "$exe"
          done <<< "${{ steps.compile.outputs.executables }}"

          echo "Zipped ${{ steps.compile.outputs.compiled_count }} executable(s)"

      - name: Upload artifact
        if: steps.compile.outputs.compiled_count > 0
        uses: actions/upload-artifact@v4
        with:
          name: qb64pe-linux-x86_64-executables
          path: ${{ github.workspace }}/artifacts/qb64pe_Linux_x86_64_executables.zip
          retention-days: 30

      - name: Job summary
        if: success()
        shell: bash
        run: |
          echo "## QB64-PE Linux x86_64 Build Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "Compiled ${{ steps.compile.outputs.compiled_count }} program(s):" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          while IFS= read -r exe; do
            [ -n "$exe" ] && echo "- \`$exe\`" >> "$GITHUB_STEP_SUMMARY"
          done <<< "${{ steps.compile.outputs.executables }}"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the zip from **Artifacts** below" >> "$GITHUB_STEP_SUMMARY"
          echo "*These are native Linux x86_64 executables (no extension).*" >> "$GITHUB_STEP_SUMMARY"
